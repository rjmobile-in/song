<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RJ Mobile | Audio Broadcaster</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="manifest" href="manifest.json" />

  <meta name="theme-color" content="#0a1023" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="container">

    <header class="header">
      <div class="brand-group">
        <img src="logo.png" alt="RJ Mobile Logo" class="brand-logo" />
        <div>
          <div class="brand-title">RJ Mobile</div>
          <div class="brand-subtitle">Store Audio Broadcaster</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-branch" id="btn-change-branch" title="Change Branch">
          <span class="branch-icon">🏪</span>
          <span class="branch-name" id="branch-label">Branch</span>
        </button>
        <div class="loop-badge">🔁 Auto-Loop</div>
      </div>
    </header>

    <div class="player-card">
      <div class="now-playing-banner">
        <span class="track-badge" id="current-badge">Loading...</span>
        <div class="visualizer" id="visualizer">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>

      <div class="track-meta">
        <div class="track-title" id="player-title">Loading playlist...</div>
      </div>

      <p class="autoplay-hint hidden" id="autoplay-hint">
        Tap the play button to start audio (browser autoplay policy)
      </p>

      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="time-row">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="controls-row">
        <button class="btn-ctrl" id="btn-prev" title="Previous Track" aria-label="Previous Track">⏮</button>
        <button class="btn-ctrl btn-play-main" id="btn-play" title="Play / Pause" aria-label="Play or Pause">▶</button>
        <button class="btn-ctrl" id="btn-next" title="Next Track" aria-label="Next Track">⏭</button>
      </div>
    </div>

    <div class="playlist-section">
      <div class="playlist-header">
        <div class="playlist-title">Playlist</div>
        <div class="track-count-badge" id="track-count-text">0 Tracks</div>
      </div>

      <div class="track-list" id="track-list-container">
        <div class="empty-state">Loading playlist...</div>
      </div>
    </div>

  </div>

  <!-- Branch selection modal -->
  <div class="branch-overlay" id="branch-overlay">
    <div class="branch-modal" role="dialog" aria-labelledby="branch-modal-title" aria-modal="true">
      <div class="branch-modal-icon">🏪</div>
      <h2 id="branch-modal-title">Select Your Store Branch</h2>
      <p>Choose or enter your branch name so playback analytics are tracked correctly.</p>

      <div class="branch-form">
        <input
          type="text"
          class="branch-input"
          id="branch-input"
          placeholder="e.g. Downtown, Mall Outlet..."
          autocomplete="organization"
          maxlength="100"
        />

        <div class="branch-suggestions">
          <button type="button" class="branch-chip">Main Street</button>
          <button type="button" class="branch-chip">Downtown</button>
          <button type="button" class="branch-chip">Mall Outlet</button>
          <button type="button" class="branch-chip">Airport</button>
          <button type="button" class="branch-chip">Warehouse</button>
        </div>

        <p class="branch-error" id="branch-error"></p>

        <button type="button" class="btn-branch-save" id="btn-branch-save">Continue</button>
      </div>
    </div>
  </div>

  <!-- Audio Engine & Preloader Engine -->
  <audio id="audio-engine" preload="auto"></audio>
  <audio id="audio-preloader" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
